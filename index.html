<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>norinIM | Burhonov Temurbek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .brand { font-family: 'Playfair Display', serif; }
        .owner-glow { box-shadow: 0 0 15px rgba(37, 99, 235, 0.2); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-[#F8FAFC]">

    <div id="login-view" class="fixed inset-0 z-[100] bg-[#0A1128] flex items-center justify-center p-6">
        <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-sm text-center">
            <h2 class="brand text-4xl mb-2 italic text-[#0A1128]">norin<span class="text-blue-600 font-light text-3xl">IM</span></h2>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8">System Owner: Temurbek</p>
            <div class="space-y-3">
                <input id="u" type="text" placeholder="Owner Login" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 border-none transition-all">
                <input id="p" type="password" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 border-none transition-all">
                <button onclick="login()" class="w-full py-4 bg-[#0A1128] text-white rounded-2xl font-black hover:bg-blue-800 transition shadow-lg">UNLOCK SYSTEM</button>
            </div>
        </div>
    </div>

    <div id="main-ui" class="hidden">
        <nav class="p-6 bg-white border-b flex justify-between items-center sticky top-0 z-50">
            <div class="brand text-2xl italic font-black">norin<span class="text-blue-600">IM</span></div>
            <div class="px-4 py-1 bg-yellow-50 text-yellow-700 rounded-full text-[9px] font-black uppercase tracking-widest border border-yellow-200">
                Super-Admin: Burhonov Temurbek
            </div>
        </nav>

        <main class="p-8 max-w-5xl mx-auto text-center">
            <h1 class="brand text-7xl md:text-[100px] leading-none mb-6 text-[#0A1128]">DIGITAL<br><span class="text-blue-600 italic">PORTAL</span></h1>
            <p class="text-slate-400 font-bold uppercase tracking-[0.4em] text-[10px] mb-20 italic">"Sifatli ta'lim — buyuk kelajak garovi"</p>
            
            <div class="grid md:grid-cols-2 gap-8 text-left">
                <div class="p-12 bg-[#0A1128] rounded-[4rem] text-white shadow-2xl relative overflow-hidden group">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-600/20 rounded-full group-hover:scale-150 transition-all"></div>
                    <p class="text-[10px] font-bold uppercase opacity-50 mb-2">Total Students</p>
                    <h3 class="text-6xl font-black italic">450+</h3>
                </div>
                <div class="p-12 bg-white rounded-[4rem] border-2 border-dashed border-slate-200 flex flex-col justify-center items-center">
                    <p class="text-slate-300 font-black text-xl italic uppercase">Tizim Ishga Tayyor</p>
                </div>
            </div>
        </main>

        <footer class="mt-40 py-10 border-t border-slate-100 text-center">
            <p class="text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">
                norinIM &copy; 2026 | PROJECT OWNER: BURHONOV TEMURBEK
            </p>
        </footer>
    </div>

    <script>
        const AUTH = { u: "owner_admin", p: "Maktab_2026_Global" };
        function login() {
            if(document.getElementById('u').value === AUTH.u && document.getElementById('p-inp' || 'p').value === AUTH.p) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('main-ui').classList.remove('hidden');
            } else { alert("Xato!"); }
        }
    </script>
</body>
</html>
